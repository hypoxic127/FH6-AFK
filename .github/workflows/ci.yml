name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# 同一分支/PR 上的新提交会取消仍在运行的旧 CI，节省 Actions 配额
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # 行尾无需在此强制：.gitattributes 已声明 `* text=auto eol=lf`，
      # checkout 在 Linux 上即为 LF，ruff format 检查直接通过。

      - name: Install Ruff
        run: pip install ruff==0.15.15

      - name: Run Ruff linter
        run: ruff check . --output-format=github

      - name: Check formatting
        run: ruff format --check .

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=8.0.0"

      - name: Run unit tests
        run: pytest -v --tb=short -m "not hardware"
        env:
          PYTHONPATH: ${{ github.workspace }}
