name: Resolve Issue with OpenHands CLI

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  resolve-issue:
    # Trigger when the 'bug' label is added
    if: github.event.label.name == 'bug'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch all history so the agent has full context
          fetch-depth: 0

      - name: Set up GitHub Environment
        run: |
          echo "ISSUE_NUMBER=${{ github.event.issue.number }}" >> $GITHUB_ENV
          
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: false

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install OpenHands CLI
        run: |
          uv tool install openhands --python 3.12

      - name: Comment on issue (Start)
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            github.rest.issues.createComment({
              issue_number: Number(process.env.ISSUE_NUMBER),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🤖 OpenHands CLI is taking a look at this issue! \n\n[View the execution logs here](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            });

      - name: Run OpenHands Agent
        id: openhands
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'gemini-1.5-pro' }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          # Some litellm configurations prefer the explicit provider key
          GEMINI_API_KEY: ${{ secrets.LLM_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          # We run openhands in headless mode targeting the current workspace
          # The agent will edit files in-place
          openhands --headless --override-with-envs --task "Analyze the following issue carefully: '$ISSUE_TITLE'. Description: '$ISSUE_BODY'. FIRST, verify if the bug actually exists in the current codebase. If the issue describes a non-existent problem, a user environment issue (like missing drivers or wrong game settings), or a misunderstanding, DO NOT modify any code. Instead, write a polite and helpful explanation addressed to the user into a file named 'issue_response.txt' in the root directory and finish the task. Only modify files if you genuinely find a bug in the code." || echo "Agent exited with non-zero status but may have made partial progress"

      - name: Check for changes and create Pull Request
        id: process_result
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Preserve the agent's response file before git operations
          if [ -f issue_response.txt ]; then
            mv issue_response.txt /tmp/issue_response.txt
            echo "HAS_RESPONSE=true" >> $GITHUB_OUTPUT
          else
            echo "HAS_RESPONSE=false" >> $GITHUB_OUTPUT
          fi

          # Check if the agent modified any tracked files or added new ones
          if [[ -n $(git status --porcelain) ]]; then
            echo "Changes detected! Creating PR..."
            
            # Setup Git
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            
            BRANCH_NAME="openhands-fix-issue-${{ github.event.issue.number }}"
            git checkout -b "$BRANCH_NAME"
            
            # Prevent GITHUB_TOKEN from pushing workflow changes, which causes permission errors
            git restore .github/workflows/ 2>/dev/null || true
            
            # Check again if there are changes left after restoring workflows
            if [[ -z $(git status --porcelain) ]]; then
              echo "Only workflow files were modified, which GITHUB_TOKEN cannot push. Aborting PR."
              echo "CREATED_PR=false" >> $GITHUB_OUTPUT
              exit 0
            fi

            git add .
            git commit -m "fix: resolve issue #${{ github.event.issue.number }}"
            
            # Push changes to the new branch
            git push -u origin "$BRANCH_NAME"
            
            # Create Pull Request using GitHub CLI
            PR_URL=$(gh pr create \
              --title "Fix issue #${{ github.event.issue.number }}" \
              --body "This PR was generated automatically by OpenHands CLI to resolve issue #${{ github.event.issue.number }}." \
              --base main \
              --head "$BRANCH_NAME")
            
            echo "PR_URL=$PR_URL" >> $GITHUB_ENV
            echo "CREATED_PR=true" >> $GITHUB_OUTPUT
          else
            echo "No changes were made by the agent."
            echo "CREATED_PR=false" >> $GITHUB_OUTPUT
          fi

      - name: Comment on issue (Result)
        uses: actions/github-script@v7
        if: always()
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CREATED_PR: ${{ steps.process_result.outputs.CREATED_PR }}
          HAS_RESPONSE: ${{ steps.process_result.outputs.HAS_RESPONSE }}
          PR_URL: ${{ env.PR_URL }}
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const fs = require('fs');
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const createdPr = process.env.CREATED_PR === 'true';
            const hasResponse = process.env.HAS_RESPONSE === 'true';
            
            let message = '';
            
            if (hasResponse && fs.existsSync('/tmp/issue_response.txt')) {
              const agentResponse = fs.readFileSync('/tmp/issue_response.txt', 'utf8');
              message += `💡 **OpenHands Agent 分析回复:**\n\n${agentResponse}\n\n---\n`;
            }
            
            if (createdPr) {
              message += `✅ OpenHands 修复了代码并创建了 Pull Request: [点击查看改动](${process.env.PR_URL})`;
            } else if (!hasResponse) {
              message += `❌ OpenHands 运行结束，没有发现需要修改的代码，也没有留下回复。请检查 Action 日志。`;
            }
            
            if (message !== '') {
              github.rest.issues.createComment({
                issue_number: issueNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: message
              });
            }
